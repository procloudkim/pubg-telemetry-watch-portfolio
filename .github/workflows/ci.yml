name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[typecheck]"
      - name: Recorded type check and offline regression including child processes
        shell: bash
        run: |
          parent_netns=$(readlink /proc/self/ns/net)
          sudo unshare --net -- "$(command -v python)" tools/offline_check.py \
            --parent-netns "$parent_netns" --state-dir "${{ runner.temp }}/pubg-ops-demo" \
            --record-dir "${{ runner.temp }}/pubg-validation"
      - name: Interpret recorded validation for current conditions
        if: always()
        run: sudo "$(command -v python)" tools/validation_status.py "${{ runner.temp }}/pubg-validation/result.json"
      - name: Validation evidence in job log
        if: always()
        run: sudo cat "${{ runner.temp }}/pubg-validation/result.json" "${{ runner.temp }}/pubg-validation/"*.log
